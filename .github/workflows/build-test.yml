name: Build + test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint_test:
    name: Lint tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
      - name: Run static analysis tests
        shell: bash
        run: scripts/lint.sh
  unit_test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
      - uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: '~1.21.7'
      - run: go test -v -timeout 10m -race ./...
        env:
          CGO_CFLAGS: "-O -D__BLST_PORTABLE__" # Set the CGO flags to use the portable version of BLST
  e2e_test:
    name: e2e tests
    runs-on: ${{ matrix.os }}
    strategy:
        matrix:
            os: [ubuntu-22.04, macos-14]
    steps:
      - name: Git checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # v3
        with:
          go-version: '~1.21.7'
      - name: Run e2e tests
        shell: bash
        run: scripts/tests.e2e.sh
      - name: Set ubuntu tmpdir into actions env
        if: always() && startsWith(matrix.os, 'ubuntu')
        run: echo "ANR_TMPDIR=/tmp/" >> $GITHUB_ENV
      - name: Set macos tmpdir into actions env
        if: always() && startsWith(matrix.os, 'macos')
        run: echo "ANR_TMPDIR=$TMPDIR" >> $GITHUB_ENV
      - name: "Upload Artifact"
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anr-logs-${{ matrix.os }}
          path: |
            ${{ env.ANR_TMPDIR }}/network-runner-root-data*
          retention-days: 5
